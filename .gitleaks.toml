title = "CareerMonke Gitleaks Allowlist"

[allowlist]
description = "Allowlist for existing known offline test fixtures and documentation examples"
paths = [
  '''(?i)scripts/test-.*''',
  '''(?i)scripts/lib/.*''',
  '''(?i)\.env\.example''',
  '''(?i)security/.*''',
]
regexes = [
  '''(?i)rzp_test_[a-zA-Z0-9_-]+''',
]
