name: Python Job Ingestion (every 4 hours)

on:
  schedule:
    - cron: '47 2-23/4 * * *'
  workflow_dispatch:

concurrency:
  group: ingest-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    name: Python ingestion (separate Workday and non-Workday cohorts)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/scraper/requirements.txt

      - name: Install scraper requirements
        run: pip install -r scripts/scraper/requirements.txt

      - name: Check production credentials
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error title=Missing secrets::Set Supabase URL and service role key repository Actions secrets."
            exit 2
          fi
          mkdir -p reports

      - name: Run Workday cohort
        id: workday
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          set +e
          python -m scripts.scraper.run_ingestion --write-to-database --production --expire --cohort workday \
            > reports/python-ingest-workday.json 2> reports/python-ingest-workday-stderr.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 40 reports/python-ingest-workday-stderr.log

      - name: Run non-Workday cohort
        id: non_workday
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          set +e
          python -m scripts.scraper.run_ingestion --write-to-database --production --expire --cohort non-workday \
            > reports/python-ingest-non-workday.json 2> reports/python-ingest-non-workday-stderr.log
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 40 reports/python-ingest-non-workday-stderr.log

      - name: Aggregate cohort reports
        if: always()
        env:
          WORKDAY_EXIT: ${{ steps.workday.outputs.exit_code }}
          NON_WORKDAY_EXIT: ${{ steps.non_workday.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os
          out = ["### Python ingestion cohorts", "", "| cohort | result | sources | failed | fetched | deduped | inserted | updated | unchanged | expired | persistence failed | guard veto | SHA |", "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---|---|"]
          failed_run = False
          for name, code_key, path in (("workday", "WORKDAY_EXIT", "reports/python-ingest-workday.json"), ("non-workday", "NON_WORKDAY_EXIT", "reports/python-ingest-non-workday.json")):
              code = os.environ.get(code_key) or "n/a"
              try:
                  with open(path, encoding="utf-8") as fh:
                      r = json.load(fh)
              except Exception as exc:
                  r = {}
                  out.append(f"| {name} | no report ({type(exc).__name__}, exit {code}) | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 | unknown | unknown | unknown |")
                  failed_run = True
                  continue
              db = r.get("db") or {}
              failed = r.get("failed_sources") or []
              result = "OK" if code == "0" else f"FAILED ({code})"
              out.append("| {} | {} | {} | {} | {} | {} | {} | {} | {} | {} | {} | {} | {} |".format(
                  name, result, len(r.get("selected_sources") or []), len(failed), r.get("fetched", 0), r.get("deduped", 0),
                  db.get("inserted", 0), db.get("updated", 0), db.get("skipped_unchanged", 0), db.get("expired", 0),
                  db.get("persistence_failed", False), r.get("expiry_vetoed", False), r.get("sha", "unknown")))
              if code != "0":
                  failed_run = True
              for item in failed:
                  msg = str(item.get("error") or "")[:300].replace("\n", " ")
                  print(f"::error title={name} source failed::{item.get('source')}: {msg}")
              for item in (db.get("write_errors") or [])[:10]:
                  print(f"::error title={name} persistence failed::{str(item)[:300]}")
          summary = "\n".join(out)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")
          if failed_run:
              raise SystemExit(1)
          PY

      - name: Upload cohort reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ingest-cohort-reports-${{ github.run_id }}
          path: reports/python-ingest-*
          if-no-files-found: ignore
          retention-days: 14
