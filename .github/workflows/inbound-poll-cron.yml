name: Inbound Reply Poll

# Backend sheet rank 14: polls the sender mailbox for replies into
# public.inbound_replies (docs/inbound-replies.md). Every 4 hours is a
# chosen default; the job exits green until the owner activates polling
# (INBOUND_POLL_ENABLED + gmail.readonly re-consent).

on:
  schedule:
    - cron: "15 */4 * * *" # every 4 hours at :15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbound-poll
  cancel-in-progress: false

jobs:
  inbound-poll:
    name: Poll Inbound Replies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Poll Inbound Replies
        env:
          INBOUND_POLL_ENABLED: ${{ vars.INBOUND_POLL_ENABLED }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/poll-inbound-replies.ts
