name: Plan Regression

# Audit DB #14: wire the EXPLAIN pack into CI so a slow query plan cannot
# ship unnoticed. Runs the read-only pack (supabase/scripts/explain-checks.sql)
# against the database named by the SUPABASE_DB_URL secret and fails on
# structural regressions (seq scans on the guarded large tables).
#
# Owner step: add the SUPABASE_DB_URL repository secret (prefer a read-only
# Postgres role). Until the secret exists, this workflow passes with a notice.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/scripts/explain-checks.sql"
      - ".github/workflows/plan-regression.yml"
      - "scripts/check-plan-regression.mjs"

permissions:
  contents: read

jobs:
  explain-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run EXPLAIN pack
        id: explain
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL secret not set; skipping plan regression run (owner step)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          mkdir -p plan-output
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/scripts/explain-checks.sql > plan-output/explain-checks.txt 2>&1

      # Advisory for now (owner decision): seq-scan checks can false-positive
      # on small tables and must not block migration PRs. The step still runs
      # and its verdict is written to the job summary. Flip to blocking later
      # by removing continue-on-error once the guard list is proven.
      - name: Check for plan regressions
        id: check
        if: steps.explain.outputs.skipped == 'false'
        continue-on-error: true
        run: node scripts/check-plan-regression.mjs plan-output/explain-checks.txt

      - name: Report verdict to job summary
        if: steps.explain.outputs.skipped == 'false'
        run: |
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "## Plan regression: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Plan regression: FAIL (advisory - not blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "Review plan-output/explain-checks.txt in the artifact; the check found a structural regression." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload plan output
        if: steps.explain.outputs.skipped == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: explain-pack-output
          path: plan-output/
          retention-days: 30
