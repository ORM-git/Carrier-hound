name: Daily Early-Access Signup Digest Cron

on:
  schedule:
    # Runs once a day at 18:00 UTC (11:30 PM IST)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no digest email sent, no gmail_send_log write)'
        required: false
        type: boolean
        default: false

jobs:
  early-access-digest:
    name: Send Daily Early-Access Signup Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Early-Access Daily Digest Cron
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPS_SCRIPT_MAIL_URL: ${{ secrets.APPS_SCRIPT_MAIL_URL }}
          APPS_SCRIPT_MAIL_SECRET: ${{ secrets.APPS_SCRIPT_MAIL_SECRET }}
          EARLY_ACCESS_NOTIFY_EMAIL: ${{ secrets.EARLY_ACCESS_NOTIFY_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry"
          fi
          echo "Executing: npx tsx scripts/early-access-digest-cron.ts $ARGS"
          npx tsx scripts/early-access-digest-cron.ts $ARGS
