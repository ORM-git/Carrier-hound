name: ATS Board Ingestion (Dry-Run / Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum number of company boards to process (leave empty for all)'
        required: false
        type: string
        default: '30'
      ats:
        description: 'Filter by ATS provider'
        required: false
        type: choice
        options:
          - all
          - greenhouse
          - lever
          - ashby
        default: all
      company:
        description: 'Filter by company name substring'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  board-ingest:
    name: Run ATS Board Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ATS Board Ingestion (Dry-Run)
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_ATS: ${{ github.event.inputs.ats }}
          INPUT_COMPANY: ${{ github.event.inputs.company }}
        run: |
          CLI_ARGS=()
          if [[ -n "$INPUT_LIMIT" && "$INPUT_LIMIT" =~ ^[0-9]+$ ]]; then
            CLI_ARGS+=(--limit "$INPUT_LIMIT")
          fi
          if [[ -n "$INPUT_ATS" && "$INPUT_ATS" =~ ^(greenhouse|lever|ashby)$ ]]; then
            CLI_ARGS+=(--ats "$INPUT_ATS")
          fi
          if [[ -n "$INPUT_COMPANY" && "$INPUT_COMPANY" =~ ^[A-Za-z0-9\ .-]+$ ]]; then
            CLI_ARGS+=(--company "$INPUT_COMPANY")
          fi

          echo "Starting ATS board ingestion runner in safe dry-run mode..."
          npx tsx scripts/board-ingest.ts "${CLI_ARGS[@]}"
