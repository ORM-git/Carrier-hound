name: Source Health Monitoring

on:
  schedule:
    - cron: '30 4 * * *' # Daily at 04:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health-monitoring
  cancel-in-progress: false

jobs:
  check-source-health:
    name: Check Source Health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Source Health Check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/check-source-health.ts
