name: Continuous Integration (Build, Lint & Test)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  ci:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
      SUPABASE_URL: 'https://placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-anon-key-ci'
      SUPABASE_ANON_KEY: 'dummy-anon-key-ci'
      SUPABASE_SERVICE_ROLE_KEY: ''
      SUPABASE_SERVICE_KEY: ''
      GROQ_API_KEY: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Error Budget Policy Check
        run: npx tsx scripts/test-error-budget-policy.ts

      - name: Run Type Check
        run: npm run type-check

      - name: Log Retention Doc Check
        run: npx tsx scripts/test-log-retention-doc.ts

      - name: Run Linter
        run: npm run lint

      - name: Account Deletion Anonymize Checks
        run: npx tsx scripts/test-account-deletion-anonymize.ts

      - name: Build Application
        run: npm run build

      - name: Performance Budget (Lighthouse)
        # Measures the static export in out/ against budgets/performance.json
        # (owner-measured mobile baseline 82, documented flake tolerance).
        # Non-blocking until a CI-runner median is measured; then tighten the
        # budget to (CI median - tolerance) and remove continue-on-error.
        continue-on-error: true
        run: npm run check:perf

      - name: Tail Latency Gate Check
        run: npx tsx scripts/test-tail-latency-gate.ts
        env:
          # Build the Cloudflare (next-on-pages) variant: production ships on
          # Cloudflare Pages; the edge-runtime /jobs/detail page cannot go
          # through the Node prerender step of `output: "export"` builds.
          CF_PAGES: '1'

      - name: Verify Public Sourcemap Guard
        run: node scripts/test-public-sourcemaps.mjs && node scripts/check-public-sourcemaps.mjs

      - name: Bundle Size Budget
        run: npm run check:budget

      - name: Sub-processor Inventory Check
        run: npx tsx scripts/test-subprocessor-inventory.ts

      - name: Run Test Suite (test:all)
        run: npm run test:all

      - name: Coverage Thresholds
        run: npm install --no-save @vitest/coverage-v8@2.1.9 && npx vitest run --coverage

      - name: API Versioning Policy Check
        run: npx tsx scripts/test-api-versioning-policy.ts

      - name: Release Versioning Policy Check
        run: npx tsx scripts/test-release-versioning-policy.ts

      - name: Config Drift Check
        run: npx tsx scripts/check-config-drift.ts

      - name: Suite-runner Integrity
        run: npx tsx scripts/test-suite-runner-integrity.ts
