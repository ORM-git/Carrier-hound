name: Continuous Integration (Build, Lint & Test)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  ci:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
      SUPABASE_URL: 'https://placeholder.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'dummy-anon-key-ci'
      SUPABASE_ANON_KEY: 'dummy-anon-key-ci'
      SUPABASE_SERVICE_ROLE_KEY: ''
      SUPABASE_SERVICE_KEY: ''
      GROQ_API_KEY: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          # Build the Cloudflare (next-on-pages) variant: production ships on
          # Cloudflare Pages; the edge-runtime /jobs/detail page cannot go
          # through the Node prerender step of `output: "export"` builds.
          CF_PAGES: '1'

      - name: Run Test Suite (test:all)
        run: npm run test:all
