name: Scaled Job Ingestion & Cleanup Pipeline

on:
  schedule:
    # Runs every 4 hours (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no writes to Supabase)'
        required: false
        type: boolean
        default: false
      cap:
        description: 'Maximum jobs to ingest in this run'
        required: false
        type: string
        default: '50000'
      mode:
        description: 'Ingestion mode: scheduled (438 validated boards sharded) or seed (52 tech companies)'
        required: false
        type: choice
        options:
          - scheduled
          - seed
        default: scheduled
      source:
        description: 'Specific source ID to run (leave blank for all)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest Jobs (Shard ${{ matrix.shard + 1 }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Job Ingestion Pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.mode }}" = "scheduled" ] || [ -z "${{ github.event.inputs.mode }}" ]; then
            ARGS="$ARGS --scheduled --shard ${{ matrix.shard }} --total-shards 6"
          elif [ "${{ github.event.inputs.mode }}" = "seed" ]; then
            ARGS="$ARGS --seed --shard ${{ matrix.shard }} --total-shards 6"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry"
          fi
          if [ -n "${{ github.event.inputs.cap }}" ]; then
            ARGS="$ARGS --cap ${{ github.event.inputs.cap }}"
          fi
          if [ -n "${{ github.event.inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ github.event.inputs.source }}"
          fi

          # Safe pre-flight credential presence check (never prints secrets)
          HAS_URL=0
          HAS_KEY=0
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -n "$SUPABASE_URL" ]; then HAS_URL=1; fi
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -n "$SUPABASE_SERVICE_KEY" ]; then HAS_KEY=1; fi

          if [ "$HAS_URL" -eq 0 ] || [ "$HAS_KEY" -eq 0 ]; then
            if [[ "$ARGS" == *"--dry"* ]]; then
              echo "⚠️ [CI Notice] Supabase secrets not configured. Proceeding in offline DRY-RUN mode."
            else
              echo "::error title=Missing GitHub Repository Secrets::Live job ingestion requires Supabase credentials. Missing: $([ $HAS_URL -eq 0 ] && echo 'NEXT_PUBLIC_SUPABASE_URL ') $([ $HAS_KEY -eq 0 ] && echo 'SUPABASE_SERVICE_ROLE_KEY'). Please configure them in Repository Settings -> Secrets and variables -> Actions."
            fi
          fi

          npx tsx scripts/ingest.ts $ARGS
