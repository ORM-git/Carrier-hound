name: Cron Failure Visibility Alert

on:
  workflow_run:
    workflows:
      - "Weekly Retention Purge Cron"
      - "Daily Early-Access Signup Digest Cron"
      - "Daily Candidate Matching & Digest Cron"
      - "Dunning Outbox Dispatch Cron"
      - "Capacity Headroom Report"
      - "Read-only DB Health Probe"
      - "Inbound Reply Poll"
      - "Daily Job Ingestion & Cleanup Pipeline"
      - "Plan Regression"
      - "Security & Secret Scanning"
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  alert-on-cron-failure:
    name: Alert on Cron Failure
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dispatch Failure Alert
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npx tsx scripts/workflow-failure-alert.ts
