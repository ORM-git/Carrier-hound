[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/simulate-checkout"
  to = "/.netlify/functions/simulate-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/jobs/pro"
  to = "/.netlify/functions/jobs-pro"
  status = 200
  force = true

[[redirects]]
  from = "/api/jobs/top10"
  to = "/.netlify/functions/jobs-top10"
  status = 200
  force = true

[[redirects]]
  from = "/api/jobs/search"
  to = "/.netlify/functions/jobs-search"
  status = 200
  force = true

[[redirects]]
  from = "/api/account/delete"
  to = "/.netlify/functions/account-delete"
  status = 200
  force = true

[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200
  force = true

[[redirects]]
  from = "/job-search"
  to = "/jobs"
  status = 301
  force = true

[[redirects]]
  from = "/job-search/all"
  to = "/jobs"
  status = 301
  force = true

[[redirects]]
  from = "/paywall"
  to = "/jobs"
  status = 301
  force = true

[[redirects]]
  from = "/jobs/detail"
  to = "/jobs/detail.html"
  status = 200
  force = false

[[redirects]]
  from = "/jobs/:id"
  to = "/jobs/detail.html"
  status = 200
  force = false

[[redirects]]
  from = "/jobs/*"
  to = "/jobs/detail.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://checkout.razorpay.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://randomuser.me https://avatar.iran.liara.run https://i.pravatar.cc https://unavatar.io https://t3.gstatic.com https://*.googleusercontent.com https://*.supabase.co; connect-src 'self' https://szakevhxhwpeskidvtfs.supabase.co https://*.supabase.co wss://*.supabase.co https://accounts.google.com https://*.googleapis.com https://checkout.razorpay.com https://api.razorpay.com https://unavatar.io https://t3.gstatic.com; frame-src 'self' https://accounts.google.com https://*.supabase.co https://api.razorpay.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
